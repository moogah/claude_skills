<script>
(function () {

const scen = [];

  s.items = [];

function counts(c, id, tree) {
  const run = c.runs[tree]; if (!run) return null;
  const ts = run.trials, ran = ts.filter((t) => id in t.items);

}

    const run = c.runs[TREE]; if (!run) return;
    const ids = Object.keys(run.cites).filter((id) => /-E\d+$/.test(id) && run.cites[id].includes(s.key));

// ---- header
const nCited = scen.filter((s) => s.items.length).length, nPass = scen.filter((s) => s.status === "pass").length;
const nFail = scen.filter((s) => s.status === "fail" || s.status === "mixed").length;
const first = D.spec.purpose.split(/(?<=\.)\s/)[0];
$("#top").innerHTML = `
  <div class="crumb">orchestrate · specs · ${esc(D.source.spec)}</div>
  <h1>${esc(D.spec.title)}</h1>
  <p class="purpose"><span id="pu">${esc(first)}</span> ${first !== D.spec.purpose ? '<button id="pmore">more</button>' : ""}</p>
  <div class="cov"><div class="bar">
    <span style="width:${(100 * nPass) / scen.length}%;background:var(--pass)"></span>
    <span style="width:${(100 * nFail) / scen.length}%;background:var(--fail)"></span></div>
    <span>${scen.length} scenarios · ${nCited} cited by an eval case · ${nPass} of them pass every trial on <b>${esc(TREE || "no tree")}</b> · ${scen.length - nCited} not cited yet</span></div>
  <div class="meta">spec: ${esc(D.spec.status.split(";")[0])}${D.spec.status.includes(";") ? "; " + esc(D.spec.status.split(";").pop().trim()) : ""}<br>read at skill-evals ${esc(D.source.worktree_head)}${D.source.spec_dirty ? " (uncommitted changes)" : ""} · evals ${esc(D.source.evals_head)}</div>`;
const pm = $("#pmore");
if (pm) pm.onclick = () => { $("#pu").textContent = D.spec.purpose; pm.remove(); };

// ---- the list
let filt = "all", cur = null;
function nav() {
  const f = { all: () => true, cited: (s) => s.items.length, uncited: (s) => !s.items.length };
  let h = `<div class="filter">${["all", "cited", "uncited"].map((k) => `<button class="chip ${filt === k ? "on" : ""}" data-f="${k}">${k}</button>`).join("")}</div>`;
  D.spec.requirements.forEach((r, ri) => {
    const ss = scen.filter((s) => s.ri === ri && f[filt](s));
    if (!ss.length) return;
    h += `<div class="req">${esc(r.title)}</div>`;
    ss.forEach((s) => (h += `<button class="sc ${s.items.length ? "" : "uncited"} ${cur === s ? "on" : ""}" data-s="${s.slug}"><span class="dot d-${s.status}"></span>${esc(s.title)}</button>`));
  });
  $("#nav").innerHTML = h;
  $("#nav").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { filt = b.dataset.f; nav(); }));
  $("#nav").querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { location.hash = b.dataset.s; }));
}

// ---- the walkthrough: milestones of every trial, aligned
function align(trials) {
  const rows = [];
  trials.forEach((t) => {
    const seen = {}; let at = -1;
    t.milestones.forEach((m) => {
      const k = m.sig + "#" + (seen[m.sig] = (seen[m.sig] || 0) + 1);
      let i = rows.findIndex((r) => r.k === k);
      if (i < 0) { rows.splice(at + 1, 0, { k, sig: m.sig, lane: m.lane, by: [] }); i = at + 1; }
      rows[i].by.push({ trial: t.trial, m, calls: t.calls });
      at = i;

  });
  // order by the mean call number across the trials that reached it: the calls are each trial's clock
  const mean = (r) => r.by.reduce((a, b) => a + (b.m.call == null ? 1e6 : b.m.call), 0) / r.by.length;
  return rows.map((r, i) => ({ r, i, k: mean(r) })).sort((a, b) => a.k - b.k || a.i - b.i).map((x) => x.r);
}
const LANES = [["git", "git · the change branch"], ["tests", "tests"], ["record", "record · journal, asks"], ["spawn", "spawned agents · the stop"]];
function evText(r) {
  const m = r.by[0].m;
  if (r.lane === "tests") return m.label.includes("fails") ? `test run <span class="red">fails</span>` : `test run <span class="green">passes</span>`;
  if (r.lane === "git") return esc(r.sig.replace(/^merge /, "merges ").replace(/^inline fix after /, "inline fix after merging "));
  if (r.lane === "record") return esc(r.sig.replace(/ on [\w-]+$/, "").replace(/^journal /, "journal: "));
  return esc(r.sig.replace(/^spawn /, "spawns ").replace(/ (\S+)$/, " for $1"));

const MARK = { true: '<span class="mk ok" title="passed">✓</span>', false: '<span class="mk no" title="failed">✕</span>', null: '<span class="mk na" title="not applicable">–</span>' };
const VMARK = (v) => v === "pass" ? MARK.true : v === "fail" ? MARK.false : v == null ? '<span class="mk na" title="not judged">·</span>' : `<span class="mk na" title="${esc(v)}">?</span>`;
const KIND = { decide: "decides: its failure fails the trial", signal: "signal: a word match, decides nothing", audited: "audited: computed, then reviewed by the eval agent; decides nothing" };
const KSHORT = { decide: "decides the trial", signal: "signal · decides nothing", audited: "audited · decides nothing" };

// The ids a run's own case version cites for this scenario: items (…-E<n>) the eval agent judges, checks (…-S<n>).
function runCites(run, s) {
  const ids = Object.keys(run.cites).filter((id) => run.cites[id].includes(s.key)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  return { items: ids.filter((id) => /-E\d+$/.test(id)), checks: ids.filter((id) => /-S\d+$/.test(id)) };
}

let tree = null, open = {};
function proof(s, c) {
  const trees = treesOf(c);
  if (!trees.length) return `<div class="empty">${esc(c.id)} cites this scenario, but no run of it counts yet.</div>`;
  if (!tree || !c.runs[tree]) tree = trees[0];
  const run = c.runs[tree], N = run.trials.length, rc = runCites(run, s), rows = align(run.trials);
  const rowOf = (id) => rows.findIndex((r) => r.by.some((b) => b.m.checks.includes(id)));
  const q = (id) => ((run.items_then.find((x) => x.id === id) || c.items.find((x) => x.id === id) || {}).question || "");
  let h = `<div class="tabs">${trees.map((t) => `<button class="chip ${t === tree ? "on" : ""}" data-t="${t}">${esc(t)}</button>`).join("")}
    <span class="tag">${esc(c.id)} · run ${esc(run.run)} on ${esc(tree)} ${esc(run.commit)} · case at ${esc(run.case_commit)} · ${N} trials</span></div>`;
  const now = c.items.filter((it) => it.cites.includes(s.key)).map((it) => it.id);
  if (now.join() !== rc.items.join()) h += `<div class="note">The case has changed since this run: it now cites this scenario from ${now.length ? esc(now.join(", ")) : "no item"}; this run's version cited it from ${rc.items.length ? esc(rc.items.join(", ")) : "no item"}.</div>`;
  if (!rc.items.length && !rc.checks.length) return h + `<div class="empty">This run's version of the case did not test this scenario.</div>`;
  h += `<div class="verdict">`;
  rc.items.forEach((id) => {
    const k = `j${tree}${id}`;
    h += `<div class="item"><div class="tag">${esc(id)} · the eval agent's verdict, reading the evidence the case collects</div>

  if (rc.checks.length) {
    h += `<div class="checks"><div class="crow head"><div>check</div><div>what it computes</div><div>trials</div><div>where it looks</div></div>`;
    rc.checks.forEach((id) => {
      const k = `c${tree}${id}`, any = run.trials.map((t) => t.checks[id]).find((x) => x) || {}, ri = rowOf(id);

      h += `<div class="crow ${any.kind === "decide" ? "" : "weak"}" data-o="${k}"><div><b>${esc(id)}</b><div class="tag" title="${esc(KIND[any.kind] || "")}">${esc(KSHORT[any.kind] || any.kind || "")}</div></div>

        <div>${ri >= 0 ? `walkthrough row ${ri + 1}` : `the end state, not one event`}</div></div>`;

      }).join("") + (any.kind !== "decide" ? `<div class="note">This check ${any.kind === "signal" ? "is a word match and" : "is reviewed by the eval agent and"} does not decide the trial: a ✕ here does not fail it.</div>` : "") + `</div>`;
    });
    h += `</div><div class="legend">${Object.entries(KIND).map(([k, v]) => `<span><b>${k}</b>: ${esc(v.split(": ").pop())}</span>`).join("")}<span>click a check for what it found in each trial</span></div>`;
  }

    <div class="seq"><div class="lanes"><div></div>${LANES.map(([k, l]) => `<div class="${k === "spawn" ? "boundary" : ""}">${l}</div>`).join("")}<div>checks of this scenario</div></div>`;
  rows.forEach((r, i) => {
    const ids = rc.checks.filter((id) => r.by.some((b) => b.m.checks.includes(id)));
    const badges = ids.map((id) => { const p = run.trials.filter((t) => t.checks[id] && t.checks[id].pass === true).length; return `<span class="badge">${esc(id)} ${p}/${N}</span>`; }).join("");
    h += `<div class="row" data-r="${i}"><div class="n">${i + 1}</div>${LANES.map(([k]) =>
      `<div class="${k === "spawn" ? "boundary" : ""}">${k === r.lane ? `<span class="ev ${k}">${evText(r)}<span class="cnt">${r.by.length}/${N}</span></span>` : ""}</div>`).join("")}<div>${badges}</div></div>`;
    if (open[tree + i]) {
      h += `<div class="detail">` + r.by.map((b) => {
        const call = b.m.call != null ? b.calls[String(b.m.call)] : null;
        return `<div><b>t${b.trial}</b> · ${esc(b.m.label)}<br><span class="tag">${b.m.call != null ? `call ${b.m.call} of the main thread (${esc(b.m.linked_by)})${b.m.candidates.length > 1 ? `; also in calls ${b.m.candidates.filter((n) => n !== b.m.call).join(", ")}` : ""}` : "no call found that made it"}${b.m.checks.length ? ` · read by ${b.m.checks.join(", ")}` : ""}</span>
          ${call ? `<pre>${esc(call.tool)}${call.error ? " (the call returned an error)" : ""}: ${esc(call.text)}</pre>` : ""}</div>`;
      }).join("") + (r.by.length < N ? `<div class="note">Not in ${N - r.by.length} of ${N} trials.</div>` : "") + `</div>`;
    }
  });
  h += `</div><div class="legend"><span>n/${N} after an event: the trials that did it</span><span>a check's badge: that check read this event; n/${N}: the trials it passed</span><span>click a row for the calls</span></div>`;
  return h;
}

// ---- one scenario
function show(s) {
  cur = s; nav();
  const when = s.steps.filter((x) => x.kw === "WHEN" || x.kw === "GIVEN"), then = s.steps.filter((x) => x.kw === "THEN" || x.kw === "AND");
  let h = `<div class="kicker">Requirement · ${esc(s.req.title)}</div>
    <h2>${esc(s.title)}</h2>
    <div class="cards">
      <div class="card when"><div class="kicker">When</div><ul>${when.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul></div>
      <div class="card then"><div class="kicker">Then</div><ul>${then.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul></div>
    </div>
    <p class="reqtext" id="rq"><button class="link" id="rqb">The requirement's text</button>${s.req.goal ? ` · goal: ${esc(s.req.goal)}` : ""}</p>
    <h3>How it was checked</h3>`;
  const cs = D.cases.filter((c) => c.items.some((it) => it.cites.includes(s.key)) || D.trees.some((t) => c.runs[t] && runCites(c.runs[t], s).items.length + runCites(c.runs[t], s).checks.length));
  h += cs.length ? cs.map((c) => proof(s, c)).join("") : `<div class="empty">No eval case cites this scenario yet${s.test ? `; the spec marks it ${esc(s.test)}` : ""}.</div>`;
  $("#detail").innerHTML = h;
  $("#rqb").onclick = () => { $("#rq").textContent = s.req.text; };
  $("#detail").querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { tree = b.dataset.t; open = {}; show(s); }));
  $("#detail").querySelectorAll("[data-o]").forEach((b) => (b.onclick = () => { open[b.dataset.o] = !open[b.dataset.o]; show(s); }));
  $("#detail").querySelectorAll(".row[data-r]").forEach((r) => (r.onclick = () => { const k = tree + r.dataset.r; open[k] = !open[k]; show(s); }));
}

function route() {
  const s = scen.find((x) => x.slug === location.hash.slice(1)) || scen.find((x) => x.items.length) || scen[0];
  show(s);
}
window.addEventListener("hashchange", route);
$("#foot").textContent = `Generated by orchestrate/docs/pages/build.py. Everything on this page is computed from the spec, the eval cases and their recorded trials; nothing is written by hand.` +
  (D.unknown_citations.length ? ` Citations naming no scenario: ${D.unknown_citations.join("; ")}.` : "");
route();
})();
</script>
