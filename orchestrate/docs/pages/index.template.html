<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestrate specs</title>
<!-- Generated by build.py from index.template.html; edit the template, not this file. -->
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --accent: #2f5fd0; --pass: #1f8a4c; --fail: #c0392b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09e97; --line: #33322f;
  --accent: #7ea2ff; --pass: #4cc283; --fail: #ff7a6b;
} }
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09e97; --line: #33322f;
  --accent: #7ea2ff; --pass: #4cc283; --fail: #ff7a6b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 48px; }
.crumb { color: var(--muted); font-size: 13px; }
h1 { font-size: 26px; margin: 4px 0 6px; }
.total { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.total .key { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }
.total .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
a.spec { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  margin-bottom: 10px; color: inherit; text-decoration: none; }
a.spec:hover, a.spec:focus-visible { border-color: var(--accent); }
.name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.name b { font-size: 16px; color: var(--accent); }
.name code { font: 12px var(--mono); color: var(--muted); }
.cov { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.bar { display: flex; width: 220px; max-width: 100%; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); flex: none; }
.bar span { display: block; height: 100%; }
.cov span.t { min-width: 0; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="index.data.js?v={{data_version}}"></script>
<script>
(function () {
const P = window.SPEC_INDEX.pages;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = (k) => P.reduce((a, p) => a + p[k], 0);
const trees = [...new Set(P.map((p) => p.tree).filter(Boolean))];
let h = `<div class="crumb">orchestrate · specs</div><h1>Specs</h1>
  <div class="total">${P.length} specs · ${sum("scenarios")} scenarios · ${sum("cited")} cited by an eval case · ${sum("pass")} pass every trial${trees.length === 1 ? ` on <b>${esc(trees[0])}</b>` : ""} · ${sum("scenarios") - sum("cited")} not cited yet<br>
  <span class="key"><span class="sw" style="background:var(--pass)"></span>passes every trial</span><span class="key"><span class="sw" style="background:var(--fail)"></span>fails in at least one trial</span><span class="key"><span class="sw" style="background:var(--line)"></span>not run, or not cited</span></div>`;
P.forEach((p) => {
  h += `<a class="spec" href="${esc(p.capability)}.html"><div class="name"><b>${esc(p.title)}</b>${p.title === p.capability ? "" : `<code>${esc(p.capability)}</code>`}</div>
    <div class="cov"><div class="bar"><span style="width:${(100 * p.pass) / p.scenarios}%;background:var(--pass)"></span><span style="width:${(100 * p.fail) / p.scenarios}%;background:var(--fail)"></span></div>
    <span class="t">${p.scenarios} scenarios · ${p.cited} cited · ${p.pass} pass every trial${trees.length === 1 ? "" : ` on <b>${esc(p.tree || "no tree")}</b>`} · ${p.scenarios - p.cited} not cited yet${p.validation ? ` · ${p.validation} of ${p.cases} cases show one validation trial, not a counted run` : ""}</span></div></a>`;
});
document.getElementById("root").innerHTML = h;
})();
</script>
</body>
</html>
