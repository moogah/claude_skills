    h += `</div>`;
  }
  // the walkthrough
  const mine = rows.map((r, i) => i).filter((i) => rows[i].by.some((b) => b.m.checks.some((id) => rc.checks.includes(id))));
  const kAll = `all${c.id}${tree}`, whole = !!open[kAll], shown = whole ? rows.map((r, i) => i) : mine;
  const others = rows.length - mine.length;
  h += `<h3>Walkthrough: ${whole ? "every event of" : "the events this scenario's checks read, in"} ${N > 1 ? `the ${N} trials` : "the trial"}</h3>`;
  if (!mine.length && !whole) h += `<div class="empty">This scenario's checks read no single event; they read the end state.</div>`;
  if (shown.length) h += `<div class="seq"><div class="lanes"><div></div>${LANES.map(([k, l]) => `<div class="${k === "spawn" ? "boundary" : ""}">${l}</div>`).join("")}<div>checks of this scenario</div></div>`;
  shown.forEach((i) => {
    const r = rows[i];
    const ids = rc.checks.filter((id) => r.by.some((b) => b.m.checks.includes(id)));
    const badges = ids.map((id) => { const p = run.trials.filter((t) => t.checks[id] && t.checks[id].pass === true).length; return `<span class="badge">${esc(id)} ${N > 1 ? `${p}/${N}` : p ? "✓" : "✕"}</span>`; }).join("");
    h += `<div class="row" data-r="${c.id}|${tree}|${i}"><div class="n">${i + 1}</div>${LANES.map(([k]) =>
      `<div class="${k === "spawn" ? "boundary" : ""}">${k === r.lane ? `<span class="ev ${k}">${evText(r)}${N > 1 ? `<span class="cnt">${r.by.length}/${N}</span>` : ""}</span>` : ""}</div>`).join("")}<div>${badges}</div></div>`;
    if (open[`${c.id}|${tree}|${i}`]) {
      h += `<div class="detail">` + r.by.map((b) => `<div><b>t${b.trial}</b> · ${esc(b.m.label)}${b.m.checks.length ? ` <span class="tag">· read by ${b.m.checks.join(", ")}</span>` : ""}${callBlock(b.m, b.calls)}</div>`).join("") + (r.by.length < N ? `<div class="note">Not in ${N - r.by.length} of ${N} trials.</div>` : "") + `</div>`;
    }
  });
  if (shown.length) h += `</div><div class="legend">${N > 1 ? `<span>n/${N} after an event: the trials that did it</span><span>a check's badge: that check read this event; n/${N}: the trials it passed</span>` : `<span>a check's badge: that check read this event; ✓ or ✕: its result</span>`}<span>click a row for its call</span></div>`;
  if (others || whole) h += `<button class="link more" data-o="${kAll}">${whole ? "show only the events this scenario's checks read" : `show the whole trial (${others} other event${others === 1 ? "" : "s"})`}</button>`;
  return h;
}

// ---- one scenario
function show(s) {
  cur = s; nav();
  const when = s.steps.filter((x) => x.kw === "WHEN" || x.kw === "GIVEN"), then = s.steps.filter((x) => x.kw === "THEN" || x.kw === "AND");
  let h = `<div class="cards">
      <div class="card when"><div class="kicker">When</div><ul>${when.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul></div>
      <div class="card then"><div class="kicker">Then</div><ul>${then.map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul></div>
    </div>
    <h3>How it was checked</h3>`;
  const cs = D.cases.filter((c) => c.items.some((it) => it.cites.includes(s.key)) || D.trees.some((t) => c.runs[t] && runCites(c.runs[t], s).items.length + runCites(c.runs[t], s).checks.length));
  h += cs.length ? cs.map((c, i) => proof(s, c, i)).join("") : `<div class="empty">No eval case cites this scenario yet${s.test ? `; the spec marks it ${esc(s.test)}` : ""}.</div>`;
  $("#detail").innerHTML = h;
  $("#detail").querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { tree = b.dataset.t; open = {}; show(s); }));
  $("#detail").querySelectorAll("[data-o]").forEach((b) => (b.onclick = () => { open[b.dataset.o] = !open[b.dataset.o]; show(s); }));
  $("#detail").querySelectorAll(".row[data-r]").forEach((r) => (r.onclick = () => { const k = r.dataset.r; open[k] = !open[k]; show(s); }));
}

function route() {
  const s = scen.find((x) => x.slug === location.hash.slice(1)) || scen.find((x) => x.items.length) || scen[0];
  show(s);
}
window.addEventListener("hashchange", route);
$("#foot").textContent = `Generated by orchestrate/docs/pages/build.py. Everything on this page is computed from the spec, the eval cases and their recorded trials; nothing is written by hand.` +
  (D.unknown_citations.length ? ` Citations naming no scenario: ${D.unknown_citations.join("; ")}.` : "");
route();
})();
</script>
